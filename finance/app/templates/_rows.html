{% from "_txn.html" import txn_row %}
{% for label, txns in groups %}
{% if label %}<h3 class="day">{{ label }}</h3>{% endif %}
<ul class="list{% if dated %} dated-rows{% endif %}">
  {% for t in txns %}{{ txn_row(t, dated=dated | default(false)) }}{% endfor %}
</ul>
{% endfor %}
{% if more %}<button class="load-more" data-before="{{ more }}">Show more</button>{% endif %}
