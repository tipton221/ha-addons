<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07080b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Finance{% endblock %}</title>
  <meta name="apple-mobile-web-app-title" content="Finance">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
  <link rel="stylesheet" href="/static/style.css">
  {% if nav is defined %}<link rel="stylesheet" href="/colors.css">{% endif %}
  {% block head %}{% endblock %}
  <script src="/static/app.js" defer></script>
</head>
<body data-page="{% block page %}{% endblock %}">
  <main class="wrap">
    {% if nav is defined %}
    <nav class="tabbar" aria-label="Sections">
      <a href="/" {% if nav == "inbox" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span>Inbox</span></a>
      <a href="/bills" {% if nav == "bills" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Bills</span></a>
      <a href="/search" {% if nav == "search" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search</span></a>
      <a href="/accounts" {% if nav == "accounts" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18L12 4 3 10z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>
        <span>Accounts</span></a>
    </nav>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% if nav is defined %}
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grabber"></div>
    <div class="sheet-head">
      <span class="amount" id="sheet-amount"></span>
      <div class="sub" id="sheet-sub"></div>
    </div>
    <form id="sheet-form" autocomplete="off">
      <div class="group">
        <div class="row name-row"><label for="sheet-merchant" id="sheet-title">Merchant</label><input id="sheet-merchant" name="merchant" maxlength="80" autocomplete="off" autocapitalize="words" role="combobox" aria-autocomplete="list" aria-controls="name-suggest" aria-expanded="false"></div>
        <ul class="suggest" id="name-suggest" role="listbox" hidden></ul>
        <div class="row"><label for="sheet-category">Category</label><select id="sheet-category" name="category_id"></select></div>
      </div>
      <p class="section-label">Apply name and category to</p>
      <div class="scope" role="radiogroup" aria-label="Apply name and category to">
        <label><input type="radio" name="scope" value="merchant" checked><span>All from this merchant</span></label>
        <label><input type="radio" name="scope" value="this"><span>Just this one</span></label>
      </div>
      <p class="hint" id="sheet-hint"></p>
      <div class="similar" id="sheet-similar" hidden>
        <label class="inline"><input type="checkbox" name="similar"> <span id="sheet-similar-text"></span></label>
      </div>
      <p class="section-label">Recurring</p>
      <div class="group">
        <div class="row"><label for="sheet-bill">Bill or income</label><select id="sheet-bill" name="bill_id"></select></div>
      </div>
      <p class="section-label"><label for="sheet-note">Note</label></p>
      <div class="group note-group">
        <textarea id="sheet-note" name="note" maxlength="500" placeholder="Add a note"></textarea>
      </div>
      <p class="hint" id="sheet-bank"></p>
      <div class="sheet-actions">
        <button type="button" id="sheet-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </section>
  <section class="sheet" id="edit-sheet" role="dialog" aria-modal="true" hidden>
    <div class="grabber"></div>
    <div id="edit-body"></div>
  </section>
  <div class="toast" id="toast" role="status"></div>
  {% endif %}
</body>
</html>
