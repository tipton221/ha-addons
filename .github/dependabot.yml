# Daily checks for newer pinned versions, taking a release once it's 3 days old (a release
# with a problem is usually pulled or fixed by then). Each update arrives as a pull request,
# which dependabot-merge.yml merges once the tests pass; the version is then raised and the
# droplet installs it.
version: 2
updates:
  - package-ecosystem: docker
    directory: /finance
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    ignore:
      # Python 3.13 to 3.14 and similar jumps get a deliberate, tested update instead.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: pip
    directory: /finance
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
